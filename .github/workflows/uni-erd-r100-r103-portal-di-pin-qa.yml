name: UNI ERD R100 R103 Portal provider fingerprint QA

on:
  push:
    branches:
      - review/uni-erd-r100-r103-portal-provider-pin-2026-11-20
    paths:
      - 'scripts/check-portal-default-deny.php'
      - 'app/Providers/AppServiceProvider.php'
      - 'app/Domain/Access/PortalAuthority.php'
      - 'app/Domain/Access/PortalGrant.php'
      - 'app/Domain/Access/PortalAccessGate.php'
      - 'app/Domain/Access/UnavailablePortalAuthority.php'
      - 'ops/release-gates.json'
      - '.github/workflows/uni-erd-r100-r103-portal-di-pin-qa.yml'
      - 'docs/UNI-ERD-R100-R103-PORTAL-PROVIDER-SENTINELA-2026-11-20.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r100-r103-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-pin-no-portal-grants:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run real PHP deny-all and fixed provider sentinel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r100-r103-portal-provider-pin-2026-11-20"
          test ! -e .env && test ! -e .env.production
          php -l scripts/check-portal-default-deny.php
          php -l scripts/check-access-domain.php
          php -l app/Providers/AppServiceProvider.php
          php scripts/check-portal-default-deny.php
          php scripts/check-access-domain.php
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(x=>x.status!=="NOT_VERIFIED"))process.exit(1)'
          echo 'PASS: Portal defaults deny all, provider pinned, no grants or service authority.'
