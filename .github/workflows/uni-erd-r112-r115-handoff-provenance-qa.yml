name: UNI ERD R112 R115 offline handoff provenance QA

on:
  push:
    branches:
      - review/uni-erd-r112-r115-source-bound-artifacts-2026-11-20
    paths:
      - 'scripts/verify-editorial-review-handoff.mjs'
      - 'scripts/check-verify-editorial-review-handoff.mjs'
      - 'scripts/verify-editorial-priority-html.mjs'
      - 'scripts/build-editorial-review-priority.mjs'
      - 'scripts/render-editorial-priority-html.mjs'
      - 'scripts/validate-editorial-priority-report.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R112-R115-PROVENIENCIA-ARTEFATOS-2026-11-20.md'
      - '.github/workflows/uni-erd-r112-r115-handoff-provenance-qa.yml'

permissions:
  contents: read

concurrency:
  group: uni-erd-r112-r115-${{ github.ref }}
  cancel-in-progress: false

jobs:
  json-markdown-html-source-bound:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact SHA without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify three offline handoff formats (no external integrations)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r112-r115-source-bound-artifacts-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/verify-editorial-review-handoff.mjs
          node --check scripts/check-verify-editorial-review-handoff.mjs
          node scripts/check-verify-editorial-review-handoff.mjs
          node scripts/build-editorial-review-priority.mjs --json > "$RUNNER_TEMP/uni-r114-report.json"
          node scripts/build-editorial-review-priority.mjs --markdown > "$RUNNER_TEMP/uni-r114-report.md"
          node scripts/render-editorial-priority-html.mjs > "$RUNNER_TEMP/uni-r114-report.html"
          node scripts/verify-editorial-review-handoff.mjs --json < "$RUNNER_TEMP/uni-r114-report.json"
          node scripts/verify-editorial-review-handoff.mjs --markdown < "$RUNNER_TEMP/uni-r114-report.md"
          node scripts/verify-editorial-review-handoff.mjs --html < "$RUNNER_TEMP/uni-r114-report.html"
          node scripts/check-priority-report-invariants.mjs
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          test -z "$(git status --porcelain)"
          echo "PASS: JSON, Markdown, HTML bound to synthetic 35-lesson source; no release."
