name: UNI ERD R12-R17 offline editorial source safety

on:
  push:
    branches:
      - review/uni-erd-r12-r13-source-text-safety-2026-11-19
    paths:
      - '.github/workflows/uni-erd-r12-r13-source-text-safety.yml'
      - 'scripts/editorial-text-safety.mjs'
      - 'scripts/build-editorial-review-pack.mjs'
      - 'scripts/check-editorial-text-safety.mjs'
      - 'scripts/check-editorial-pack-preflight.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'

permissions:
  contents: read

concurrency:
  group: uni-erd-r12-r13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-safety:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact review candidate, without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deny release or non-laboratory scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "review/uni-erd-r12-r13-source-text-safety-2026-11-19"
          test ! -e .env && test ! -e .env.production
          test -f content/mvp-cursos-v1.json
          test -f ops/release-gates.json
      - name: Syntax, actual 35 lessons, negative controls, immutable handoff
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/editorial-text-safety.mjs
          node --check scripts/build-editorial-review-pack.mjs
          node --check scripts/check-editorial-text-safety.mjs
          node scripts/check-editorial-text-safety.mjs
          node --check scripts/check-editorial-pack-preflight.mjs
          node scripts/check-editorial-pack-preflight.mjs
          echo 'Editorial preflight includes six late-source failures, including fatal UTF-8'
          node scripts/check-editorial-review-pack.mjs
          node scripts/check-editorial-review-validation.mjs
          node scripts/check-release-gate-policy.mjs
          node -e 'const g=require("./ops/release-gates.json"); if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(x=>x.status!=="NOT_VERIFIED"))process.exit(1)'
          echo 'PASS draft laboratory only; no production authority or editorial signoff'
