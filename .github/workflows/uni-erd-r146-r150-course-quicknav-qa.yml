name: UNI ERD R146 R150 Offline course shortcuts QA

on:
  push:
    branches:
      - review/uni-erd-r146-r150-course-quicknav-2026-11-20
    paths:
      - 'scripts/render-editorial-fulltext-html.mjs'
      - 'scripts/verify-editorial-fulltext-html.mjs'
      - 'scripts/check-editorial-course-quicknav.mjs'
      - 'scripts/qa-browser-fulltext-courses.cjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R146-R150-ATALHOS-10-CURSOS-2026-11-20.md'
      - '.github/workflows/uni-erd-r146-r150-course-quicknav-qa.yml'

permissions:
  contents: read

concurrency:
  group: uni-erd-r146-r150-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity-and-gates:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source, exact SHA, 13 gates and ten shortcuts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r146-r150-course-quicknav-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/render-editorial-fulltext-html.mjs
          node --check scripts/check-editorial-course-quicknav.mjs
          node --check scripts/qa-browser-fulltext-courses.cjs
          node scripts/check-editorial-fulltext-html.mjs
          node scripts/check-editorial-course-quicknav.mjs
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r146-course-fulltext.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r146-course-fulltext.html"
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          test -z "$(git status --porcelain)"

  chromium-shortcuts:
    needs: integrity-and-gates
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      UNI_BROWSER_LAB: synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ephemeral browser dependencies and generate verified HTML
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r146-r150-course-quicknav-2026-11-20"
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r146-course-fulltext.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r146-course-fulltext.html"
          mkdir -p "$RUNNER_TEMP/uni-r146-qa-deps"
          cd "$RUNNER_TEMP/uni-r146-qa-deps"
          npm init -y >/dev/null
          timeout -k 5s 180s npm install --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.10.2
          command -v google-chrome
      - name: Test keyboard shortcuts, mobile and WCAG 2.1
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/uni-r146-qa-deps/node_modules" \
          node scripts/qa-browser-fulltext-courses.cjs "$RUNNER_TEMP/uni-r146-course-fulltext.html"
          test -z "$(git status --porcelain)"
