name: UNI ERD R151 R155 Curricular index QA

on:
  push:
    branches:
      - review/uni-erd-r151-r155-curricular-lesson-index-2026-11-20
    paths:
      - 'scripts/render-editorial-fulltext-html.mjs'
      - 'scripts/verify-editorial-fulltext-html.mjs'
      - 'scripts/check-editorial-curricular-index.mjs'
      - 'scripts/qa-browser-curricular-index.cjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R151-R155-INDICE-CURRICULAR-2026-11-20.md'
      - '.github/workflows/uni-erd-r151-r155-curricular-index-qa.yml'

permissions:
  contents: read

concurrency:
  group: uni-erd-r151-r155-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curricular-integrity:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node static and fail-closed checks on exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r151-r155-curricular-lesson-index-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/render-editorial-fulltext-html.mjs
          node --check scripts/check-editorial-curricular-index.mjs
          node --check scripts/qa-browser-curricular-index.cjs
          node scripts/check-editorial-fulltext-html.mjs
          node scripts/check-editorial-course-quicknav.mjs
          node scripts/check-editorial-curricular-index.mjs
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r151-curriculum.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r151-curriculum.html"
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          test -z "$(git status --porcelain)"

  chrome-curriculum:
    needs: curricular-integrity
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      UNI_BROWSER_LAB: synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate verified offline artifact and install ephemeral Chrome harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r151-r155-curricular-lesson-index-2026-11-20"
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r151-curriculum.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r151-curriculum.html"
          mkdir -p "$RUNNER_TEMP/uni-r151-qa-deps"
          cd "$RUNNER_TEMP/uni-r151-qa-deps"
          npm init -y >/dev/null
          timeout -k 5s 180s npm install --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.10.2
          command -v google-chrome
      - name: Test 35 lesson focus transitions, WCAG and no network
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/uni-r151-qa-deps/node_modules" \
          node scripts/qa-browser-curricular-index.cjs "$RUNNER_TEMP/uni-r151-curriculum.html"
          test -z "$(git status --porcelain)"
