name: UNI ERD R180 R184 Rubric quick jump QA

on:
  push:
    branches:
      - review/uni-erd-r180-r184-rubric-quickjump-2026-11-20
    paths:
      - 'scripts/render-editorial-fulltext-html.mjs'
      - 'scripts/render-editorial-priority-html.mjs'
      - 'scripts/check-editorial-rubric-jumps.mjs'
      - 'scripts/qa-browser-editorial-rubric-jumps.cjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R180-R184-RUBRICA-ATALHOS-2026-11-20.md'
      - '.github/workflows/uni-erd-r180-r184-rubric-quickjump-qa.yml'

permissions:
  contents: read

concurrency:
  group: uni-erd-r180-r184-rubric-quickjump
  cancel-in-progress: false

jobs:
  static-rubric-and-gates:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SHA, rubric, inherited tests and release gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r180-r184-rubric-quickjump-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/render-editorial-fulltext-html.mjs
          node --check scripts/render-editorial-priority-html.mjs
          node --check scripts/check-editorial-rubric-jumps.mjs
          node --check scripts/qa-browser-editorial-rubric-jumps.cjs
          node scripts/check-editorial-fulltext-html.mjs
          node scripts/check-editorial-section-deeplinks.mjs
          node scripts/check-editorial-section-returns.mjs
          node scripts/check-editorial-course-sequence.mjs
          node scripts/check-editorial-rubric-jumps.mjs
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r180-rubric.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r180-rubric.html"
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          test -z "$(git status --porcelain)"

  chrome-rubric:
    needs: static-rubric-and-gates
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      UNI_BROWSER_LAB: synthetic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate offline reader and install ephemeral test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r180-r184-rubric-quickjump-2026-11-20"
          node scripts/render-editorial-fulltext-html.mjs > "$RUNNER_TEMP/uni-r180-rubric.html"
          node scripts/verify-editorial-fulltext-html.mjs "$RUNNER_TEMP/uni-r180-rubric.html"
          mkdir -p "$RUNNER_TEMP/uni-r180-browser-deps"
          cd "$RUNNER_TEMP/uni-r180-browser-deps"
          npm init -y >/dev/null
          timeout -k 5s 180s npm install --no-audit --no-fund playwright@1.58.2 @axe-core/playwright@4.10.2
          command -v google-chrome
      - name: Chrome 35 focus transitions, 390px, axe and no network
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/uni-r180-browser-deps/node_modules" \
          node scripts/qa-browser-editorial-rubric-jumps.cjs "$RUNNER_TEMP/uni-r180-rubric.html"
          test -z "$(git status --porcelain)"
