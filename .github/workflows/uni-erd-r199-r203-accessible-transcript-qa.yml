name: UNI ERD R199 R203 Accessible transcript QA

on:
  push:
    branches:
      - review/uni-erd-r199-r203-accessible-transcript-2026-11-20
    paths:
      - 'scripts/render-editorial-reading-transcript.mjs'
      - 'scripts/verify-editorial-reading-transcript.mjs'
      - 'scripts/check-editorial-reading-transcript.mjs'
      - 'scripts/build-editorial-navigation-manifest.mjs'
      - 'scripts/build-editorial-review-priority.mjs'
      - 'scripts/build-editorial-human-checklist.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R199-R203-TRANSCRICAO-ACESSIVEL-2026-11-20.md'
      - '.github/workflows/uni-erd-r199-r203-accessible-transcript-qa.yml'

permissions:
  contents: read

concurrency:
  group: uni-erd-r199-r203-accessible-transcript
  cancel-in-progress: false

jobs:
  transcript-source-contract:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact HEAD, full lesson transcript, negative tests and release gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r199-r203-accessible-transcript-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/render-editorial-reading-transcript.mjs
          node --check scripts/verify-editorial-reading-transcript.mjs
          node --check scripts/check-editorial-reading-transcript.mjs
          node scripts/render-editorial-reading-transcript.mjs > "$RUNNER_TEMP/uni-editorial-leitura.txt"
          node scripts/verify-editorial-reading-transcript.mjs "$RUNNER_TEMP/uni-editorial-leitura.txt"
          node scripts/check-editorial-reading-transcript.mjs
          node scripts/check-editorial-navigation-manifest.mjs
          node scripts/check-editorial-fulltext-html.mjs
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          test -z "$(git status --porcelain)"
