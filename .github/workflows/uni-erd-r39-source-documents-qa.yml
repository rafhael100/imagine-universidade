name: UNI ERD R39 R40 source bound documents QA

on:
  push:
    branches:
      - review/uni-erd-r39-source-docs-2026-11-19
    paths:
      - '.github/workflows/uni-erd-r39-review-manifest-qa.yml'
      - 'scripts/editorial-package-integrity.mjs'
      - 'scripts/editorial-source-review-render.mjs'
      - 'scripts/check-editorial-package-integrity.mjs'
      - 'scripts/build-editorial-review-pack.mjs'
      - 'scripts/check-editorial-review-pack.mjs'
      - 'scripts/check-editorial-pack-preflight.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R39-R40-VERIFICACAO-ARTEFATOS-FONTE-2026-11-19.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r39-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa-review-manifest-deny:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify synthetic 35-lesson package and fake-approval negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "review/uni-erd-r39-source-docs-2026-11-19"
          test ! -e .env && test ! -e .env.production
          node --version
          node --check scripts/editorial-source-review-render.mjs
          node --check scripts/editorial-package-integrity.mjs
          node --check scripts/check-editorial-package-integrity.mjs
          node --check scripts/build-editorial-review-pack.mjs
          node scripts/check-editorial-lesson-structure.mjs
          node scripts/check-editorial-text-safety.mjs
          node scripts/check-editorial-pack-preflight.mjs
          node scripts/check-editorial-review-pack.mjs
          node scripts/check-editorial-package-integrity.mjs
          node scripts/check-release-gate-policy.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(x=>x.status!=="NOT_VERIFIED"))process.exit(1)'
          echo 'PASS synthetic-only full-source editorial document binding; 35 lessons unsigned and unapproved; 13 gates NOT_VERIFIED'
