name: UNI ERD R46 R49 safe offline CSV and accessibility QA

on:
  push:
    branches:
      - review/uni-erd-r46-csv-safety-a11y-2026-11-19
    paths:
      - '.github/workflows/uni-erd-r46-r49-offline-handoff-qa.yml'
      - 'scripts/validate-editorial-review.mjs'
      - 'scripts/check-editorial-review-validation.mjs'
      - 'scripts/editorial-review-app.js'
      - 'scripts/editorial-review-html.mjs'
      - 'scripts/check-editorial-offline-review.mjs'
      - 'scripts/editorial-package-integrity.mjs'
      - 'scripts/check-editorial-package-integrity.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'docs/UNI-ERD-R46-R49-CSV-CLI-A11Y-2026-11-19.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r46-r49-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-handoff:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline synthetic tests and check all thirteen gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "review/uni-erd-r46-csv-safety-a11y-2026-11-19"
          test ! -e .env && test ! -e .env.production
          node --version
          node --check scripts/validate-editorial-review.mjs
          node --check scripts/check-editorial-review-validation.mjs
          node --check scripts/editorial-review-app.js
          node --check scripts/editorial-review-html.mjs
          node --check scripts/check-editorial-offline-review.mjs
          node scripts/check-editorial-lesson-structure.mjs
          node scripts/check-editorial-review-validation.mjs
          node scripts/check-editorial-offline-review.mjs
          node scripts/check-editorial-package-integrity.mjs
          node scripts/check-release-gate-policy.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(x=>x.status!=="NOT_VERIFIED"))process.exit(1)'
          echo 'PASS local synthetic CLI, offline editorial accessibility checks; 13 release gates remain unverified.'
