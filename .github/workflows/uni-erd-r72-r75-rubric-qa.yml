name: UNI ERD R72 R75 35-lesson pedagogical rubric QA

on:
  push:
    branches:
      - review/uni-erd-r72-r75-rubric-2026-11-20
    paths:
      - '.github/workflows/uni-erd-r72-r75-rubric-qa.yml'
      - 'scripts/build-editorial-human-checklist.mjs'
      - 'scripts/check-editorial-human-checklist.mjs'
      - 'scripts/audit-editorial-lesson-structure.mjs'
      - 'scripts/check-editorial-lesson-structure.mjs'
      - 'scripts/check-editorial-offline-review.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - 'ops/staging/check-release-gates.mjs'
      - 'docs/UNI-ERD-R72-R75-ROTEIRO-PEDAGOGICO-2026-11-20.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r72-r75-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-editorial-rubric:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch SHA without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all 35 synthetic lessons and deny release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "review/uni-erd-r72-r75-rubric-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/build-editorial-human-checklist.mjs
          node --check scripts/check-editorial-human-checklist.mjs
          node scripts/check-editorial-lesson-structure.mjs
          node scripts/check-editorial-human-checklist.mjs
          node scripts/check-editorial-offline-review.mjs
          node scripts/check-editorial-package-integrity.mjs
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(v=>v.status!=="NOT_VERIFIED"))process.exit(1)'
          node scripts/build-editorial-human-checklist.mjs > "$RUNNER_TEMP/uni-35-lessons-review-synthetic.json"
          node -e 'const f=require("fs");const j=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+"/uni-35-lessons-review-synthetic.json"));if(j.lessons.length!==35||j.release_decision!=="HOLD_NO_GO"||j.lessons.some(x=>x.authenticated_signoff))process.exit(1)'
          echo 'PASS: all 35 editorial drafts remain unauthenticated, 13 release gates are blocked.'
      - name: Preserve synthetic handoff for human editorial review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uni-r72-r75-human-review-synthetic
          path: ${{ runner.temp }}/uni-35-lessons-review-synthetic.json
          if-no-files-found: error
          retention-days: 7
