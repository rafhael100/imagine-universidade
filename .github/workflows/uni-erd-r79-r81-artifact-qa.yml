name: UNI ERD R79 R81 source-bound editorial artifacts QA

on:
  push:
    branches:
      - review/uni-erd-r79-r81-artifact-provenance-2026-11-20
    paths:
      - 'scripts/verify-editorial-human-artifacts.mjs'
      - 'scripts/check-verify-editorial-human-artifacts.mjs'
      - 'scripts/build-editorial-human-checklist.mjs'
      - 'scripts/render-editorial-human-checklist.mjs'
      - 'scripts/check-editorial-human-checklist.mjs'
      - 'scripts/check-render-editorial-human-checklist.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - '.github/workflows/uni-erd-r79-r81-artifact-qa.yml'
      - 'docs/UNI-ERD-R79-R81-PROVENIENCIA-2026-11-20.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r79-r81-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-bound-offline-handoff:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly this SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic provenance and negative checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r79-r81-artifact-provenance-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/verify-editorial-human-artifacts.mjs
          node --check scripts/check-verify-editorial-human-artifacts.mjs
          node scripts/check-editorial-lesson-structure.mjs
          node scripts/check-editorial-human-checklist.mjs
          node scripts/check-render-editorial-human-checklist.mjs
          node scripts/check-verify-editorial-human-artifacts.mjs
          node scripts/check-editorial-package-integrity.mjs
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(v=>v.status!=="NOT_VERIFIED"))process.exit(1)'
          node scripts/build-editorial-human-checklist.mjs > "$RUNNER_TEMP/uni-35-lessons-provenance.json"
          node scripts/render-editorial-human-checklist.mjs > "$RUNNER_TEMP/uni-35-lessons-provenance.md"
          node scripts/verify-editorial-human-artifacts.mjs "$RUNNER_TEMP/uni-35-lessons-provenance.json" "$RUNNER_TEMP/uni-35-lessons-provenance.md"
          echo "Validated synthetic source-bound evidence only; operational access remains denied."
      - name: Upload source-bound drafts for human review (not signoff)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uni-r79-r81-source-bound-editorial-drafts
          path: |
            ${{ runner.temp }}/uni-35-lessons-provenance.json
            ${{ runner.temp }}/uni-35-lessons-provenance.md
          if-no-files-found: error
          retention-days: 7
