name: UNI ERD R91 R95 source-bound accessible HTML QA

on:
  push:
    branches:
      - review/uni-erd-r91-r95-html-source-bound-focus-2026-11-20
    paths:
      - 'scripts/render-editorial-priority-html.mjs'
      - 'scripts/verify-editorial-priority-html.mjs'
      - 'scripts/check-verify-editorial-priority-html.mjs'
      - 'scripts/build-editorial-review-priority.mjs'
      - 'scripts/build-editorial-human-checklist.mjs'
      - 'content/mvp-cursos-v1.json'
      - 'ops/release-gates.json'
      - '.github/workflows/uni-erd-r91-r95-html-verified-qa.yml'
      - 'docs/UNI-ERD-R91-R95-HTML-PROVENIENCIA-E-FOCO-2026-11-20.md'

permissions:
  contents: read

concurrency:
  group: uni-erd-r91-r95-${{ github.ref }}
  cancel-in-progress: false

jobs:
  html-source-bound-no-go:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-bound HTML and release hold
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "review/uni-erd-r91-r95-html-source-bound-focus-2026-11-20"
          test ! -e .env && test ! -e .env.production
          node --check scripts/render-editorial-priority-html.mjs
          node --check scripts/verify-editorial-priority-html.mjs
          node --check scripts/check-verify-editorial-priority-html.mjs
          node scripts/check-editorial-lesson-structure.mjs
          node scripts/check-editorial-human-checklist.mjs
          node scripts/check-editorial-review-priority.mjs
          node scripts/check-editorial-priority-html.mjs
          node scripts/check-verify-editorial-priority-html.mjs
          node scripts/check-release-gate-policy.mjs
          node ops/staging/check-release-gates.mjs
          node -e 'const g=require("./ops/release-gates.json");if(g.release_decision!=="HOLD_NO_GO"||Object.keys(g.blocking_evidence).length!==13||Object.values(g.blocking_evidence).some(v=>v.status!=="NOT_VERIFIED"))process.exit(1)'
          node scripts/render-editorial-priority-html.mjs > "$RUNNER_TEMP/uni-35-lessons-source-bound.html"
          node scripts/verify-editorial-priority-html.mjs "$RUNNER_TEMP/uni-35-lessons-source-bound.html"
          echo "PASS: verified source-bound offline artifact. No authenticated human review."
      - name: Upload only the verified synthetic handoff
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uni-r91-r95-verified-accessible-html
          path: ${{ runner.temp }}/uni-35-lessons-source-bound.html
          if-no-files-found: error
          retention-days: 7
