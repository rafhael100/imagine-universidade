name: UNI P0 disposable PG18 restore and verified Compose teardown

on:
  push:
    branches:
      - review/uni-p0-compose-teardown-proof-2026-11-21
      - review/uni-p0-readiness-git-config-root-fence-2026-11-22
    paths:
      - .github/workflows/uni-p0-restore-compose-teardown.yml
      - scripts/run-qa-compose.sh
      - scripts/check-qa-compose-teardown.mjs
      - scripts/qa-pg-backup-restore.sh
      - tests/Feature/PrivateUniversityResponseBoundaryTest.php
      - tests/Feature/SyntheticEditorialFixtureImportTest.php
      - scripts/qa-staging-image-build.sh
      - scripts/qa-staging-private-http.sh
      - scripts/qa-staging-postgres-http.sh
      - scripts/qa-p0-db-compose-health.sh
      - scripts/qa-staging-pg-pre-migrate.php
      - scripts/qa-staging-private-http-probe.php
      - compose.qa.yml
      - composer.json
      - composer.lock
      - .dockerignore
      - ops/qa/Dockerfile
      - ops/staging/Dockerfile.php
      - ops/staging/Dockerfile.nginx
      - ops/staging/compose.yaml
      - ops/staging/nginx.conf
      - ops/staging/check-image-digest-evidence.mjs

permissions:
  contents: read

concurrency:
  group: uni-p0-disposable-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-restore-and-cleanup:
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact isolated review head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable
        with:
          persist-credentials: false
      - name: Verify zero production credentials and local Docker isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          case "$GITHUB_REF_NAME" in
            review/uni-p0-compose-teardown-proof-2026-11-21|review/uni-p0-readiness-git-config-root-fence-2026-11-22) ;;
            *) echo 'HOLD: unapproved review branch for Docker QA' >&2; exit 2 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-universidade
          test ! -e .env && test ! -e .env.testing && test ! -e .env.local
          test ! -e .env.production && test ! -e ops/staging/.env.staging
          test -z "${DOCKER_HOST:-}"
          test "$(docker context show)" = default
          test -f composer.lock
          test -f compose.qa.yml
          test -f scripts/qa-pg-pre-migrate.php
          test -f scripts/qa-compose-entrypoint.sh
          test -f scripts/qa-pg-backup-restore.sh
          # Validate the fully resolved disposable lab model before any mutation.
          docker compose -f compose.qa.yml --profile manual-qa config --quiet
          ! grep -Eq '^[[:space:]]+ports:' compose.qa.yml
          ! grep -Fq /var/run/docker.sock compose.qa.yml
          bash -n scripts/run-qa-compose.sh
          sh -n scripts/qa-pg-backup-restore.sh
      - name: Prove fail-closed cleanup before starting real disposable Docker
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-qa-compose-teardown.mjs
          node scripts/check-qa-compose-teardown.mjs
      - name: Run existing locked Laravel and live PG18 synthetic restore in local Docker
        shell: bash
        run: |
          set -euo pipefail
          # This live run exercises the HEAD's pre-migrate Laravel+SQL proof,
          # migrations, private deny-all, snapshot/restore and verified teardown.
          bash scripts/run-qa-compose.sh | tee "$RUNNER_TEMP/uni-p0-disposable-restore.log"
          grep -Fq 'PASS QA PostgreSQL pre-migrate: effective Laravel config + live synthetic PG18 SQL checked' "$RUNNER_TEMP/uni-p0-disposable-restore.log"
          grep -Fq 'The temp backup and clone DB were removed; production/VPS backup is NOT proven.' "$RUNNER_TEMP/uni-p0-disposable-restore.log"
          grep -Fq 'PASS: synthetic PostgreSQL restore and verified disposal of QA containers, database volume and network.' "$RUNNER_TEMP/uni-p0-disposable-restore.log"
      - name: Prove live PG18 Compose SQL health revocation, recovery and verified cleanup
        shell: bash
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = review/uni-p0-readiness-git-config-root-fence-2026-11-22
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Database-only disposable Compose project; no application or migrations.
          bash scripts/qa-p0-db-compose-health.sh | tee "$RUNNER_TEMP/uni-p0-db-health.log"
          grep -Fq 'PASS: disposable PG18 Compose DB health healthy -> unhealthy (revoked fake password) -> healthy (recovered), verified cleanup.' "$RUNNER_TEMP/uni-p0-db-health.log"
          grep -Fq 'No migrations, Portal sessions/grants, private VPS or operational backup exercised. HOLD_NO_GO.' "$RUNNER_TEMP/uni-p0-db-health.log"
      - name: Confirm 13 independent gates still HOLD_NO_GO and real access denied
        run: node ops/staging/check-release-gates.mjs

  staging-private-http-and-rollback:
    # A separate disposable runner so PostgreSQL restore cleanup is not
    # accidentally reused as evidence of live private HTTP / image rollback.
    needs: compose-restore-and-cleanup
    if: github.repository == 'rafhael100/imagine-universidade'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - name: Checkout exact isolated P0 draft without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 immutable
        with:
          persist-credentials: false
      - name: Verify review-only source, local Docker context and zero secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = review/uni-p0-readiness-git-config-root-fence-2026-11-22
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-universidade
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .env && test ! -e .env.local && test ! -e .env.production
          test ! -e .env.testing && test ! -e ops/staging/.env.staging
          test -f composer.lock
          test -z "${DOCKER_HOST:-}" && test -z "${DOCKER_CONTEXT:-}"
          test -z "${DOCKER_TLS_VERIFY:-}" && test -z "${DOCKER_CERT_PATH:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{ (index .Endpoints "docker").Host }}')" = unix:///var/run/docker.sock
          for script in scripts/qa-staging-image-build.sh scripts/qa-staging-private-http.sh scripts/qa-staging-postgres-http.sh; do bash -n "$script"; done
          php -l scripts/qa-staging-pg-pre-migrate.php
          php -l scripts/qa-staging-private-http-probe.php
      - name: Query Composer production lock advisories (read-only, no release approval)
        shell: bash
        run: |
          set -euo pipefail
          # Query public package advisories only; no tokens, app session or real data.
          # A green audit is NOT an AppSec review and does NOT assess OS packages.
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = review/uni-p0-readiness-git-config-root-fence-2026-11-22
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-universidade
          test -f composer.json && test -f composer.lock
          test ! -e .env && test ! -e .env.production
          test -z "${DOCKER_HOST:-}" && test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{ (index .Endpoints "docker").Host }}')" = unix:///var/run/docker.sock
          report="$RUNNER_TEMP/uni-p0-composer-production-audit.json"
          manifest="$RUNNER_TEMP/uni-p0-composer-production-audit-provenance.json"
          test ! -e "$report" && test ! -L "$report"
          test ! -e "$manifest" && test ! -L "$manifest"
          umask 077
          # Immutable Composer image previously reviewed by source readiness.
          # Only the two public locked-dependency files are mounted read-only.
          # Outbound advisory query is isolated from Laravel and PostgreSQL.
          audit_status=0
          docker run --rm --pull always --network bridge --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --tmpfs /tmp:mode=1777 \
            --env COMPOSER_HOME=/tmp/composer \
            --env COMPOSER_CACHE_DIR=/tmp/composer/cache \
            --mount "type=bind,src=$PWD/composer.json,dst=/app/composer.json,readonly" \
            --mount "type=bind,src=$PWD/composer.lock,dst=/app/composer.lock,readonly" \
            --workdir /app --entrypoint composer \
            composer@sha256:50ea4d33fdcde1adb0f045547295faa1548b33872e5f789dae5b02ce2fb5de93 \
            audit --locked --no-dev --format=json --no-interaction > "$report" || audit_status=$?
          if test ! -s "$report"; then
            echo 'HOLD: advisory source did not produce a nonempty JSON report' >&2
            exit 2
          fi
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync,writeFileSync} from "node:fs";
            import {createHash} from "node:crypto";
            import {join} from "node:path";
            const env=process.env;
            const sha=bytes=>createHash("sha256").update(bytes).digest("hex");
            assert.match(env.GITHUB_SHA,/^[0-9a-f]{40}$/u);
            assert.match(env.GITHUB_RUN_ID,/^[0-9]+$/u);
            const bytes=readFileSync(join(env.RUNNER_TEMP,"uni-p0-composer-production-audit.json"));
            const report=JSON.parse(bytes.toString("utf8"));
            assert.ok(report && typeof report==="object" && "advisories" in report);
            const a=report.advisories;
            const findings=Array.isArray(a) ? a.length :
              Object.values(a).reduce((n,v)=>n+(Array.isArray(v)?v.length:0),0);
            const abandoned=report.abandoned ? Object.keys(report.abandoned).length : 0;
            const data={schema:1,repository:env.GITHUB_REPOSITORY,
              commit:env.GITHUB_SHA,workflow_run_id:env.GITHUB_RUN_ID,
              workflow_attempt:env.GITHUB_RUN_ATTEMPT,
              source:"composer_audit_locked_prod_only",advisory_count:findings,
              abandoned_package_count:abandoned,
              composer_lock_sha256:sha(readFileSync("composer.lock")),
              report_sha256:sha(bytes),os_cve_scan_completed:false,
              appsec_signoff:false,release_decision:"HOLD_NO_GO"};
            assert.equal(data.repository,"rafhael100/imagine-universidade");
            assert.match(data.report_sha256,/^[0-9a-f]{64}$/u);
            writeFileSync(join(env.RUNNER_TEMP,
              "uni-p0-composer-production-audit-provenance.json"),
              JSON.stringify(data,null,2)+"\n",{flag:"wx",mode:0o600});
            console.log("Composer production advisory report captured; findings="+findings+
              ", abandoned="+abandoned+"; AppSec/OS review pending; HOLD_NO_GO");
          '
          (cd "$RUNNER_TEMP" &&
            sha256sum uni-p0-composer-production-audit.json uni-p0-composer-production-audit-provenance.json \
              > uni-p0-composer-production-audit.sha256 &&
            sha256sum -c uni-p0-composer-production-audit.sha256)
          if test "$audit_status" -ne 0; then
            echo 'HOLD: Composer reported advisories/abandonment or advisory query error; human review required.' >&2
            exit 2
          fi
          echo 'PASS read-only Composer production advisory query only; no OS CVE review, no release approval.'
      - name: Preserve Composer advisory evidence for private review (not AppSec signoff)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imagine-universidade-P0-composer-audit-NOT-APPSEC-APPROVED
          path: |
            ${{ runner.temp }}/uni-p0-composer-production-audit.json
            ${{ runner.temp }}/uni-p0-composer-production-audit-provenance.json
            ${{ runner.temp }}/uni-p0-composer-production-audit.sha256
          retention-days: 14
          if-no-files-found: ignore
      - name: Exercise isolated Nginx / PHP / PG18 with live SQL and image rollback
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qa-staging-image-build.sh | tee "$RUNNER_TEMP/uni-p0-private-http-rollback.log"
          grep -Fq 'PASS synthetic health healthy -> unhealthy -> healthy; private routes remain 403' "$RUNNER_TEMP/uni-p0-private-http-rollback.log"
          grep -Fq 'PASS synthetic PG outage -> recover: SQL session store intact; private HTTP remains denied.' "$RUNNER_TEMP/uni-p0-private-http-rollback.log"
          grep -Fq 'PASS synthetic wrong-image detection and exact-image rollback; PG sessions retained and Cliente/Admin remain 403.' "$RUNNER_TEMP/uni-p0-private-http-rollback.log"
          grep -Fq 'PASS synthetic 3-service staging PG18:' "$RUNNER_TEMP/uni-p0-private-http-rollback.log"
      - name: Verify local built-image IDs against exact source and CI run (NOT registry pins)
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/uni-p0-local-built-image-identities.json"
          test -s "$evidence"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            import {createHash} from "node:crypto";
            import {join} from "node:path";
            const e=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,
              "uni-p0-local-built-image-identities.json"),"utf8"));
            const validate=d=>{
              assert.deepEqual(Object.keys(d).sort(),[
                "schema","repository","commit","workflow_run_id","workflow_attempt",
                "scope","php_image_id","nginx_image_id","registry_published",
                "release_image_digests_pinned","os_package_inventory","os_distribution",
                "complete_sbom","vulnerability_assessment_completed","release_decision"].sort());
              assert.equal(d.schema,2);
              assert.equal(d.repository,"rafhael100/imagine-universidade");
              assert.equal(d.commit,process.env.GITHUB_SHA);
              assert.equal(d.workflow_run_id,process.env.GITHUB_RUN_ID);
              assert.equal(d.workflow_attempt,process.env.GITHUB_RUN_ATTEMPT);
              assert.equal(d.scope,"ephemeral_local_build_identity_only");
              assert.match(d.php_image_id,/^sha256:[a-f0-9]{64}$/u);
              assert.match(d.nginx_image_id,/^sha256:[a-f0-9]{64}$/u);
              assert.notEqual(d.php_image_id,d.nginx_image_id);
              assert.equal(d.registry_published,false);
              assert.equal(d.release_image_digests_pinned,false);
              assert.equal(d.release_decision,"HOLD_NO_GO");
              assert.equal(d.complete_sbom,false);
              assert.equal(d.vulnerability_assessment_completed,false);
              assert.deepEqual(Object.keys(d.os_package_inventory).sort(),["nginx","php"]);
              for(const [image,filename,format] of [
                ["php","uni-p0-php-os-packages.tsv","dpkg-query"],
                ["nginx","uni-p0-nginx-os-packages.txt","apk-info"],
              ]){
                const obj=d.os_package_inventory[image];
                assert.deepEqual(Object.keys(obj).sort(),["format","rows","sha256"]);
                assert.equal(obj.format,format);
                assert.match(obj.sha256,/^[a-f0-9]{64}$/u);
                const bytes=readFileSync(join(process.env.RUNNER_TEMP,filename));
                const data=bytes.toString("utf8");
                assert.ok(data.endsWith("\n") && !data.includes("\r"));
                const lines=data.trimEnd().split("\n");
                assert.ok(lines.length >= 10);
                assert.equal(new Set(lines).size,lines.length);
                const pattern=format==="dpkg-query" ? /^[^\s\t]+\t[^\s\t]+\t[^\s\t]+$/u : /^[^\s]+$/u;
                for(const line of lines) assert.match(line,pattern);
                assert.equal(obj.rows,lines.length);
                assert.equal(obj.sha256,createHash("sha256").update(bytes).digest("hex"));
              }
              assert.deepEqual(Object.keys(d.os_distribution).sort(),["nginx","php"]);
              for(const [image,filename,id] of [
                ["php","uni-p0-php-os-release.txt","debian"],
                ["nginx","uni-p0-nginx-os-release.txt","alpine"],
              ]){
                const obj=d.os_distribution[image];
                assert.deepEqual(Object.keys(obj).sort(),["id","sha256","version_id"]);
                assert.equal(obj.id,id);
                assert.match(obj.version_id,/^[0-9][0-9A-Za-z._-]*$/u);
                assert.match(obj.sha256,/^[a-f0-9]{64}$/u);
                const bytes=readFileSync(join(process.env.RUNNER_TEMP,filename));
                assert.ok(bytes.length > 16 && bytes.length < 4096);
                const value=bytes.toString("utf8");
                assert.ok(value.endsWith("\n") && !value.includes("\r"));
                const entries=new Map();
                for(const line of value.trimEnd().split("\n")){
                  if(line.startsWith("#") || line==="") continue;
                  const m=line.match(/^([A-Z][A-Z0-9_]*)=(.*)$/u);
                  assert.ok(m && !entries.has(m[1]));
                  entries.set(m[1],m[2].replace(/^"|"$/gu,""));
                }
                assert.equal(entries.get("ID"),id);
                assert.equal(entries.get("VERSION_ID"),obj.version_id);
                assert.equal(obj.sha256,createHash("sha256").update(bytes).digest("hex"));
              }
            };
            validate(e);
            for (const mutation of [
              x=>x.commit="0".repeat(40),
              x=>x.php_image_id="not-an-image-id",
              x=>x.nginx_image_id=x.php_image_id,
              x=>x.registry_published=true,
              x=>x.release_image_digests_pinned=true,
              x=>x.os_package_inventory.php.sha256="0".repeat(64),
              x=>x.os_package_inventory.nginx.rows=0,
              x=>x.complete_sbom=true,
              x=>x.vulnerability_assessment_completed=true,
              x=>x.release_decision="GO",
              x=>x.schema=1,
              x=>x.os_distribution.php.id="alpine",
              x=>x.os_distribution.nginx.id="debian",
              x=>x.os_distribution.php.version_id="bad version",
              x=>x.os_distribution.nginx.version_id="",
              x=>x.os_distribution.php.sha256="0".repeat(64),
              x=>x.os_distribution.nginx.sha256="0".repeat(64),
            ]){
              const wrong=structuredClone(e);mutation(wrong);
              assert.throws(()=>validate(wrong));
            }
            console.log("PASS exact CI+SHA, built image IDs, OS inventories and Debian/Alpine distribution versions; 17 negative mutations; no CVE scan or release digests");
          '
          (cd "$RUNNER_TEMP" &&
            sha256sum uni-p0-local-built-image-identities.json uni-p0-php-os-packages.tsv uni-p0-nginx-os-packages.txt uni-p0-php-os-release.txt uni-p0-nginx-os-release.txt > uni-p0-local-built-image-identities.sha256 &&
            sha256sum -c uni-p0-local-built-image-identities.sha256)
      - name: Keep final local build identity evidence for review (no deploy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imagine-universidade-P0-local-built-images-NOT-REGISTRY-PINNED
          path: |
            ${{ runner.temp }}/uni-p0-local-built-image-identities.json
            ${{ runner.temp }}/uni-p0-local-built-image-identities.sha256
            ${{ runner.temp }}/uni-p0-php-os-packages.tsv
            ${{ runner.temp }}/uni-p0-nginx-os-packages.txt
            ${{ runner.temp }}/uni-p0-php-os-release.txt
            ${{ runner.temp }}/uni-p0-nginx-os-release.txt
          retention-days: 14
          if-no-files-found: error
      - name: Scan Debian and Alpine OS advisories from exact local built image IDs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = review/uni-p0-readiness-git-config-root-fence-2026-11-22
          test "$GITHUB_REPOSITORY" = rafhael100/imagine-universidade
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .env && test ! -e .env.production
          test -z "${DOCKER_HOST:-}" && test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{ (index .Endpoints "docker").Host }}')" = unix:///var/run/docker.sock
          test -s "$RUNNER_TEMP/uni-p0-local-built-image-identities.json"
          # Trivy v0.76.2 official Linux x64 archive SHA-256 verified using
          # the GitHub release asset digest, not a moving tag. Local-only scanner;
          # image archive and database cache never leave this disposable runner.
          umask 077
          scan_archive="$RUNNER_TEMP/uni-p0-trivy-0.76.2.tar.gz"
          mkdir -m 700 "$RUNNER_TEMP/uni-p0-trivy-bin" "$RUNNER_TEMP/uni-p0-trivy-cache"
          curl -fLSs --retry 2 --max-time 180 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o "$scan_archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $scan_archive" | sha256sum -c -
          tar -xzf "$scan_archive" -C "$RUNNER_TEMP/uni-p0-trivy-bin" trivy
          trivy="$RUNNER_TEMP/uni-p0-trivy-bin/trivy"
          "$trivy" --version
          trap 'rm -f "$RUNNER_TEMP"/uni-p0-*-os-image.tar "$scan_archive"' EXIT
          for role in php nginx; do
            built_id="$(ROLE="$role" node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/uni-p0-local-built-image-identities.json")); process.stdout.write(m[process.env.ROLE+"_image_id"])')"
            test "$(docker image inspect --format '{{.Id}}' "$built_id")" = "$built_id"
            test "$(docker image inspect --format '{{.Id}}' "uni-qa-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$role")" = "$built_id"
            tarfile="$RUNNER_TEMP/uni-p0-$role-os-image.tar"
            report="$RUNNER_TEMP/uni-p0-$role-os-cves.json"
            test ! -e "$tarfile" && test ! -e "$report"
            docker save "$built_id" -o "$tarfile"
            "$trivy" --cache-dir "$RUNNER_TEMP/uni-p0-trivy-cache" image \
              --input "$tarfile" --scanners vuln --pkg-types os \
              --list-all-pkgs --format json --output "$report" \
              --no-progress --timeout 8m --exit-code 0
            test -s "$report"
          done
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync,writeFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {join} from "node:path";
          const env=process.env,dir=env.RUNNER_TEMP;
          const read=name=>readFileSync(join(dir,name));
          const hash=bytes=>createHash("sha256").update(bytes).digest("hex");
          const identity=JSON.parse(read("uni-p0-local-built-image-identities.json"));
          assert.equal(identity.repository,env.GITHUB_REPOSITORY);
          assert.equal(identity.commit,env.GITHUB_SHA);
          assert.equal(identity.workflow_run_id,env.GITHUB_RUN_ID);
          assert.equal(identity.release_decision,"HOLD_NO_GO");
          assert.equal(identity.vulnerability_assessment_completed,false);
          const images=[];
          for(const [role,family] of [["php","debian"],["nginx","alpine"]]){
            const bytes=read("uni-p0-"+role+"-os-cves.json");
            const report=JSON.parse(bytes);
            const validate=data=>{
              assert.ok(data && data.SchemaVersion>=2);
              assert.equal(data.ArtifactType,"container_image");
              assert.equal(data.Metadata?.OS?.Family,family);
              const os=data.Results?.filter(r=>r.Type===family && r.Class==="os-pkgs");
              assert.ok(Array.isArray(os) && os.length>0,"missing OS advisory scan");
              const pkgs=os.flatMap(r=>r.Packages??[]);
              assert.ok(pkgs.length>=10,"empty OS inventory");
              assert.ok(pkgs.every(p=>typeof p.Name==="string" && typeof p.Version==="string"));
              const vulns=os.flatMap(r=>r.Vulnerabilities??[]);
              assert.ok(vulns.every(v=>typeof v.VulnerabilityID==="string" && typeof v.PkgName==="string"));
              return {packages:pkgs.length,findings:vulns.length,
                high_critical:vulns.filter(v=>["HIGH","CRITICAL"].includes(v.Severity)).length};
            };
            const found=validate(report);
            for(const mutate of [
              d=>{d.Metadata.OS.Family="other";},
              d=>{d.ArtifactType="filesystem";},
              d=>{d.Results=[];},
              d=>{d.Results=d.Results.map(r=>({...r,Packages:[]}));}
            ]){
              const tampered=structuredClone(report);mutate(tampered);
              assert.throws(()=>validate(tampered));
            }
            assert.match(identity[role+"_image_id"],/^sha256:[a-f0-9]{64}$/u);
            assert.equal(identity.os_distribution[role].id,family);
            images.push({role,os:family,os_version:identity.os_distribution[role].version_id,
              image_id:identity[role+"_image_id"],
              image_tar_sha256:hash(read("uni-p0-"+role+"-os-image.tar")),
              cve_report_sha256:hash(bytes),os_packages_scanned:found.packages,
              vulnerability_count:found.findings,high_critical_count:found.high_critical});
          }
          const evidence={schema:1,source:"trivy_0.76.2_vendor_os_advisories",
            trivy_archive_sha256:"bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf",
            repository:env.GITHUB_REPOSITORY,commit:env.GITHUB_SHA,
            workflow_run_id:env.GITHUB_RUN_ID,workflow_attempt:env.GITHUB_RUN_ATTEMPT,
            build_evidence_sha256:hash(read("uni-p0-local-built-image-identities.json")),
            images,full_sbom_complete:false,appsec_signoff:false,
            registry_published:false,release_decision:"HOLD_NO_GO"};
          writeFileSync(join(dir,"uni-p0-os-cve-scan-provenance.json"),
            JSON.stringify(evidence,null,2)+"\n",{flag:"wx",mode:0o600});
          console.log("PASS OS advisory evidence: "+
            images.map(i=>i.role+"="+i.vulnerability_count+" findings ("+i.high_critical_count+" HIGH/CRITICAL)").join("; ")+
            "; human triage pending; HOLD_NO_GO");
          NODE
          (cd "$RUNNER_TEMP" &&
            sha256sum uni-p0-php-os-cves.json uni-p0-nginx-os-cves.json \
              uni-p0-os-cve-scan-provenance.json > uni-p0-os-cve-scan.sha256 &&
            sha256sum -c uni-p0-os-cve-scan.sha256)
      - name: Preserve OS vulnerability reports for review, not AppSec approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imagine-universidade-P0-os-CVE-NOT-APPSEC-APPROVED
          path: |
            ${{ runner.temp }}/uni-p0-php-os-cves.json
            ${{ runner.temp }}/uni-p0-nginx-os-cves.json
            ${{ runner.temp }}/uni-p0-os-cve-scan-provenance.json
            ${{ runner.temp }}/uni-p0-os-cve-scan.sha256
          retention-days: 14
          if-no-files-found: ignore
      - name: Reconfirm deny-all and all 13 gates pending after synthetic rollback
        run: node ops/staging/check-release-gates.mjs
