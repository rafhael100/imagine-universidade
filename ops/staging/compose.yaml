name: imagine-universidade-staging

# C-62 candidate ONLY. NO automatic start, deploy or migrations.
# Explicit unique port is mandatory; a DNS/TLS proxy is separate.
services:
  app:
    build:
      context: ../..
      dockerfile: ops/staging/Dockerfile.php
    # The CLI --env-file supplies interpolation only. Never inject that
    # whole file: it also contains the migration owner's credentials.
    environment:
      APP_NAME: '${APP_NAME:-Imagine Universidade Staging}'
      APP_KEY: '${APP_KEY:?private-laravel-app-key-required}'
      APP_URL: '${APP_URL:?approved-private-staging-url-required}'
      APP_ENV: staging
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: '${UNI_STAGING_DB:?official-staging-db-name-required}'
      DB_USERNAME: '${UNI_STAGING_APP_DB_USER:?least-privilege-db-role-required}'
      DB_PASSWORD: '${UNI_STAGING_APP_DB_PASSWORD:?private-role-password-required}'
      SESSION_DRIVER: database
      SESSION_ENCRYPT: 'true'
      SESSION_SECURE_COOKIE: 'true'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: lax
      SESSION_COOKIE: imagine_universidade_staging_session
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - university_storage:/var/www/html/storage
      - university_cache:/var/www/html/bootstrap/cache
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 2g
    pids_limit: 160
    depends_on:
      db:
        condition: service_healthy
    networks:
      - university_front
      - university_database
    restart: 'no'

  web:
    build:
      context: ../..
      dockerfile: ops/staging/Dockerfile.nginx
    ports:
      - '127.0.0.1:${UNI_STAGING_LOOPBACK_PORT:?explicit-free-port-required}:8080'
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 64
    depends_on: [app]
    # Lab/private staging health only. Probe crosses Nginx -> PHP-FPM -> Laravel.
    # A healthy /up is not Portal permission, SQL readiness or release approval.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O /dev/null http://127.0.0.1:8080/up']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - university_front
    restart: 'no'

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: '${UNI_STAGING_DB:?official-staging-db-name-required}'
      POSTGRES_USER: '${UNI_STAGING_DB_OWNER:?separate-migration-owner-required}'
      POSTGRES_PASSWORD: '${UNI_STAGING_DB_OWNER_PASSWORD:?private-owner-password-required}'
    volumes:
      - university_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=2 PGOPTIONS="-c statement_timeout=2000" psql -X -w -h db -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -tA -c "SELECT 1" 2>/dev/null | grep -qx 1']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 4g
    pids_limit: 160
    networks:
      - university_database
    restart: 'no'

networks:
  university_front: {}
  university_database:
    internal: true

volumes:
  university_storage: {}
  university_cache: {}
  university_pgdata: {}
